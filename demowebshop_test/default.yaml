name: DemoWebShop_UserData

variables:
  - file:
      name: creds
      path: data/users.csv
      is_first_line_column_names: true
      change_policy: each_user
      scope: unique
      order: sequential
      out_of_value: cycle

servers:
  - name: webshop
    host: demowebshop.tricentis.com
    port: 443
    scheme: https

sla_profiles:
  - name: login_check
    thresholds:
      - error-rate warn >= 0.5% fail >= 1% per test

user_paths:
  - name: Webshop
    init:
      sla_profile: login_check
      steps:
        - transaction:
            name: open home page
            steps:
              - request:
                  url: /
                  server: webshop
        - transaction:
            name: open login page
            steps:
              - request:
                  url: /login
                  server: webshop
        - transaction:
            name: login submit
            steps:
              - request:
                  url: /login
                  method: POST
                  server: webshop
                  headers:
                    - Content-Type: application/x-www-form-urlencoded
                  body: Email=${creds.Email}&Password=${creds.Password}&RememberMe=false
        - transaction:
            name: check login
            steps:
              - request:
                  url: /
                  server: webshop
                  extractors:
                    - name: loggedIn
                      regexp: '>(Log out)<'
                      match_number: 1
                      throw_assertion_error: true
    actions:
      steps:
        - transaction:
            name: click computers
            steps:
              - request:
                  url: /computers
                  server: webshop
              - request:
                  url: /desktops
                  server: webshop
        - think_time: 2s
    end:
      steps:
        - transaction:
            name: logout
            steps:
              - request:
                  url: /logout
                  server: webshop

populations:
  - name: Population1
    user_paths:
      - name: Webshop

scenarios:
  - name: scenario1
    populations:
      - name: Population1
        constant_load:
          users: 10
          duration: 5m
